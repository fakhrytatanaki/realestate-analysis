services:
  postgres:
    image: postgres:17-alpine
    container_name: realestatepy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realestate}
      POSTGRES_DB: ${POSTGRES_DB:-realestate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realestate} -d ${POSTGRES_DB:-realestate}"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
